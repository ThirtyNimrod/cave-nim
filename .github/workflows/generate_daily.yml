name: Generate daily post

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nim-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Generate card
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py generate

      - name: Commit and push
        run: |
          git config user.name "nim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/rendered database/canon.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: generate daily post"
          git push
